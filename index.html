<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Нікіта — Дизайнер карток товарів</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="wrapper">
        <main class="bento-grid">
            
            <!-- Блок 1: Інфо про себе -->
            <div class="bento-card profile-card">
                <div class="profile-header">
                    <div class="avatar-container">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Нікіта" class="avatar">
                    </div>
                    <div class="badge-box">
                        <span class="badge">UI/UX & Marketplace</span>
                    </div>
                </div>
                <div class="profile-text">
                    <h1>Привіт, я — Нікіта</h1>
                    <p>Дизайнер карток товарів для маркетплейсів. Створюю привабливі та функціональні дизайни, які допомагають брендам виділятися серед конкурентів.</p>
                </div>
            </div>

            <!-- Блок 2: Кнопка зв'язку (з потрібним ефектом) -->
            <div class="bento-card action-card">
                <a href="https://t.me/your_telegram" target="_blank" class="magnetic-btn">
                    Обговорити проєкт
                </a>
            </div>

            <!-- Блок 3: Робота 1 (Триммер) -->
            <div class="bento-card work-card">
                <img src="Frame 27.jpg" alt="Дизайн картки: Триммер">
            </div>

            <!-- Блок 4: Робота 2 (Миша) -->
            <div class="bento-card work-card">
                <img src="Frame 28.jpg" alt="Дизайн картки: Миша">
            </div>

            <!-- Блок 5: Робота 3 (Масажний ролик) -->
            <div class="bento-card work-card">
                <img src="Frame 30.jpg" alt="Дизайн картки: Масажний ролик">
            </div>

            <!-- Блок 6: Робота 4 (Адаптер) -->
            <div class="bento-card work-card">
                <img src="Frame 31.jpg" alt="Дизайн картки: Адаптер">
            </div>

            <!-- Блок 7: Робота 5 (Мікрофон) -->
            <div class="bento-card work-card">
                <img src="Frame 32.jpg" alt="Дизайн картки: Мікрофон">
            </div>

            <!-- Блок 8: Робота 6 (Термос) -->
            <div class="bento-card work-card">
                <img src="Frame 33.jpg" alt="Дизайн картки: Похідний термос">
            </div>

            <!-- Блок 9: Робота 7 (Праска) -->
            <div class="bento-card work-card">
                <img src="Frame 34.jpg" alt="Дизайн картки: Парова праска">
            </div>

            <!-- Блок 10: Робота 8 (Навушники) -->
            <div class="bento-card work-card">
                <img src="Frame 35.jpg" alt="Дизайн картки: Бездротові навушники">
            </div>

            <!-- Блок 11: Робота 9 (Лампа) -->
            <div class="bento-card work-card">
                <img src="Frame 36.jpg" alt="Дизайн картки: Настільна лампа">
            </div>

        </main>
    </div>

</html>
